[package]
name = "koku"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A minimal, private, SQLite-backed personal finance MVP"
# 主服务二进制；gen_hash 为预览凭据生成工具，cargo run 默认仍跑服务本体。
default-run = "koku"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
bcrypt = "0.19"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
csv = "1"
getrandom = "0.4"
hmac = "0.12"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
lopdf = { version = "0.44", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rust_decimal = { version = "1.36", features = ["serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sha2_010 = { package = "sha2", version = "0.10" }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
totp-rs = { version = "5", features = ["otpauth"] }
tower-http = { version = "0.6", features = ["cors", "trace", "catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = "5.5"
utoipa-swagger-ui = { version = "9.0", features = ["axum", "debug-embed", "vendored"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

# bundled SQLite 是 C 代码，dev 模式默认 opt-level=0 会让 SQL 慢数倍；
# 这里对依赖开 O2，让本地 `cargo run` 预览也有接近生产的性能。
[profile.dev.package."*"]
opt-level = 2
