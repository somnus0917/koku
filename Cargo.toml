[package]
name = "koku"
version = "0.1.0"
edition = "2021"
description = "A minimal, private, SQLite-backed personal finance MVP"

[dependencies]
axum = "0.8"
bcrypt = "0.19"
chrono = { version = "0.4", features = ["serde"] }
getrandom = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
rust_decimal = { version = "1.36", features = ["serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# bundled SQLite 是 C 代码，dev 模式默认 opt-level=0 会让 SQL 慢数倍；
# 这里对依赖开 O2，让本地 `cargo run` 预览也有接近生产的性能。
[profile.dev.package."*"]
opt-level = 2
