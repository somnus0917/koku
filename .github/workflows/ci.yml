name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  publish:
    name: Publish ${{ matrix.service }} image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [rust, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api
            context: .
            dockerfile: ./Dockerfile
          - service: web
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}-${{ matrix.service }}:main
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Export deployment image
        env:
          DEPLOY_IMAGE: ghcr.io/${{ github.repository }}-${{ matrix.service }}:${{ github.sha }}
        run: |
          docker pull "$DEPLOY_IMAGE"
          docker save --output "koku-${{ matrix.service }}-image.tar" "$DEPLOY_IMAGE"
          gzip --fast "koku-${{ matrix.service }}-image.tar"

      - name: Upload deployment image artifact
        uses: actions/upload-artifact@v7
        with:
          name: koku-${{ matrix.service }}-image
          path: koku-${{ matrix.service }}-image.tar.gz
          compression-level: 0
          retention-days: 1

  deploy:
    name: Deploy to Tencent Cloud
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://${{ vars.KOKU_DOMAIN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download deployment images
        uses: actions/download-artifact@v8
        with:
          pattern: koku-*-image
          path: images
          merge-multiple: true

      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload deployment configuration
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" 'mkdir -p ~/koku/deploy ~/koku/data/backups'
          scp -P "$SERVER_PORT" compose.production.yml "$SERVER_USER@$SERVER_HOST:koku/compose.production.yml"
          scp -P "$SERVER_PORT" deploy/Caddyfile.example "$SERVER_USER@$SERVER_HOST:koku/deploy/Caddyfile.example"
          scp -P "$SERVER_PORT" deploy/deploy.sh "$SERVER_USER@$SERVER_HOST:koku/deploy/deploy.sh"
          scp -P "$SERVER_PORT" images/koku-api-image.tar.gz "$SERVER_USER@$SERVER_HOST:koku/deploy/koku-api-image.tar.gz"
          scp -P "$SERVER_PORT" images/koku-web-image.tar.gz "$SERVER_USER@$SERVER_HOST:koku/deploy/koku-web-image.tar.gz"
          ssh -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" 'chmod 700 ~/koku/deploy/deploy.sh'

      - name: Load deployment images
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" 'docker load --input ~/koku/deploy/koku-api-image.tar.gz'
          ssh -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" 'docker load --input ~/koku/deploy/koku-web-image.tar.gz'

      - name: Deploy and verify health
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          API_IMAGE: ghcr.io/${{ github.repository }}-api:${{ github.sha }}
          WEB_IMAGE: ghcr.io/${{ github.repository }}-web:${{ github.sha }}
        run: |
          ssh -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "KOKU_SKIP_PULL=true ~/koku/deploy/deploy.sh '$API_IMAGE' '$WEB_IMAGE'"

      - name: Remove transferred image archives
        if: always()
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            'rm -f ~/koku/deploy/koku-api-image.tar.gz ~/koku/deploy/koku-web-image.tar.gz' || true
