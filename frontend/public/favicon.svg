<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Koku 页头签名渐变 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#183025"/>
      <stop offset="0.58" stop-color="#274e3d"/>
      <stop offset="1" stop-color="#315f4b"/>
    </linearGradient>
  </defs>

  <!-- 圆角底片 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- K 字形 = 账户竖笔 + 流入/流出两条梭形箭头流水 -->
  <g fill="#f4f6f0">
    <!-- 竖笔（账户） -->
    <rect x="136" y="118" width="52" height="276" rx="26"/>
    <!-- 右上：流入（收入/入账） -->
    <polygon points="360,132 312.3,212.9 192.1,271.8 163.9,228.2 266.7,142.5"/>
    <!-- 右下：流出（支出/转账） -->
    <polygon points="360,380 312.3,299.1 192.1,240.2 163.9,283.8 266.7,369.5"/>
  </g>
</svg>
