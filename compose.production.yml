name: koku

services:
  api:
    container_name: koku-api
    image: ${KOKU_API_IMAGE:-koku-api:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
    user: ${KOKU_RUNTIME_UID:-1000}:${KOKU_RUNTIME_GID:-1000}
    restart: unless-stopped
    environment:
      KOKU_HOST: 0.0.0.0
      KOKU_PORT: 8080
      KOKU_DB_PATH: /app/data/koku.db
      KOKU_SEED_DEMO: "false"
      KOKU_AUTH_USERNAME: ${KOKU_AUTH_USERNAME:?KOKU_AUTH_USERNAME is required}
      KOKU_AUTH_PASSWORD_HASH_FILE: /app/data/auth-password.hash
      KOKU_SESSION_TTL_DAYS: ${KOKU_SESSION_TTL_DAYS:-30}
      KOKU_COOKIE_SECURE: "true"
      # 可选增强（缺省关闭/默认值，见 README）：
      KOKU_RATE_LIMIT_PER_MINUTE: ${KOKU_RATE_LIMIT_PER_MINUTE:-300}
      KOKU_BACKUP_INTERVAL_HOURS: ${KOKU_BACKUP_INTERVAL_HOURS:-0}
      KOKU_BACKUP_KEEP: ${KOKU_BACKUP_KEEP:-14}
      KOKU_QUOTE_TTL_HOURS: ${KOKU_QUOTE_TTL_HOURS:-24}
      KOKU_SMTP_HOST: ${KOKU_SMTP_HOST:-}
      KOKU_SMTP_PORT: ${KOKU_SMTP_PORT:-587}
      KOKU_SMTP_TLS: ${KOKU_SMTP_TLS:-starttls}
      KOKU_SMTP_USERNAME: ${KOKU_SMTP_USERNAME:-}
      KOKU_SMTP_PASSWORD: ${KOKU_SMTP_PASSWORD:-}
      KOKU_SMTP_FROM: ${KOKU_SMTP_FROM:-}
      KOKU_SMTP_TO: ${KOKU_SMTP_TO:-}
      KOKU_SMTP_INTERVAL_HOURS: ${KOKU_SMTP_INTERVAL_HOURS:-24}
    volumes:
      - ${KOKU_DATA_DIR:-./data}:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - "8080"
    networks:
      - backend

  web:
    container_name: koku-web
    image: ${KOKU_WEB_IMAGE:-koku-web:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - "8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend
      - proxy

networks:
  backend:
    # 需要出站：api 容器要拉取公开汇率（Frankfurter / currency-api）做跨币种折算。
    # 不要设 internal: true——Docker 内部网络禁止一切对外通信，会导致汇率查询
    # 永远失败。bridge 网络不发布端口，对公网暴露面不变。
  proxy:
    name: proxy
    external: true
